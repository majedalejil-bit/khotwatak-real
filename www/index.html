<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0b1411">
<title>خطوتك ربح</title>
<link rel="icon" href="icons/icon-192.png">
<link rel="stylesheet" href="kw-css-01-base.css">
<link rel="stylesheet" href="kw-css-02-home.css">
<link rel="stylesheet" href="kw-css-03-stats.css">
<link rel="stylesheet" href="kw-css-04-badges.css">
<link rel="stylesheet" href="kw-css-05-setup.css">
<link rel="stylesheet" href="kw-css-06-settings.css">
</head>
<body>
<header class="top">
  <div class="brand"><img src="icons/icon-192.png" alt=""><b>خطوتك ربح</b></div>
  <span class="live" id="live" hidden><i></i>شغّال</span>
</header>
<main>
  <section class="page" id="pg-home"></section>
  <section class="page" id="pg-stats" hidden></section>
  <section class="page" id="pg-badges" hidden></section>
  <section class="page" id="pg-settings" hidden></section>
</main>
<nav class="tabs" aria-label="التنقل">
  <button type="button" data-go="home" class="on"><span>🏠</span>اليوم</button>
  <button type="button" data-go="stats"><span>📊</span>إحصائيات</button>
  <button type="button" data-go="badges"><span>🏅</span>الشارات</button>
  <button type="button" data-go="settings"><span>⚙️</span>الإعدادات</button>
</nav>
<div id="toast" role="status" aria-live="polite"></div>
<div id="sheet" hidden></div>

<script src="kw-js-01-core.js"></script>
<script src="kw-js-02-native.js"></script>
<script src="kw-js-03-home.js"></script>
<script src="kw-js-04-stats.js"></script>
<script src="kw-js-05-badges.js"></script>
<script src="kw-js-06-setup.js"></script>
<script src="kw-js-07-settings.js"></script>
<script src="kw-js-08-start.js"></script>
</body>
</html>
